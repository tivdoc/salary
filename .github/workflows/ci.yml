# L8-5 / D3. Continuous integration: every update receives verification.
# An exact open-PR push delegates to the PR merge suite; unrelated pushes run
# the suite normally. A skipped duplicate is never a successful "verify" check.
# Required verification still includes
# the type check, the lint, the unit and guard suites, a plain build, and the
# production closure proof (a build under NODE_ENV=production and
# VERCEL_ENV=production with no Tivdoc flag, the closed server probed, every
# script entry point spawned and refusing). Nothing here has a secret, a
# database connection or a migration: the suites that need the DEV project
# skip themselves without credentials, and the DEV matrices are not CI.
#
# The payments reconciliation workflow beside this one is untouched.
name: CI

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.route.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: route
        name: Select push or PR merge verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-event-route.mjs
  verify:
    needs: route
    name: ${{ needs.route.outputs.run == 'false' && 'PR coverage (no duplicate suite)' || 'verify' }}
    if: ${{ always() && needs.route.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: "Check out, full history (the split test and the closure proof read main's own route inventory)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify checkout identity (PR uses the merge commit)
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {writeFileSync} from 'node:fs';
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          const checked=git('rev-parse','HEAD');
          if(checked!==process.env.GITHUB_SHA)throw Error('CI_CHECKOUT_IDENTITY');
          if(process.env.GITHUB_EVENT_NAME==='pull_request'){
            for(const pin of [process.env.PR_HEAD_SHA,process.env.PR_BASE_SHA]){
              if(!/^[a-f0-9]{40}$/.test(pin??''))throw Error('CI_PR_PIN_REQUIRED');
              git('merge-base','--is-ancestor',pin,checked);
            }
          }
          writeFileSync('ci-checkout.json',JSON.stringify({event:process.env.GITHUB_EVENT_NAME,checkout:checked,head:process.env.PR_HEAD_SHA||null,base:process.env.PR_BASE_SHA||null,repository:process.env.GITHUB_REPOSITORY,run_id:process.env.GITHUB_RUN_ID,run_attempt:process.env.GITHUB_RUN_ATTEMPT,workflow:process.env.GITHUB_WORKFLOW,workspace:process.cwd(),node:process.version}));
          NODE

      - name: Install from the lockfile
        run: npm ci

      - name: Verify pinned AI generator source build
        run: node scripts/ai-release-build-manifest.mjs --check

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npm run lint

      # Keep CPU-heavy source replay and PDF checks sequential on shared runners.
      # Retain every assertion and existing per-test timeout.
      - name: Unit and guard suites (no credentials)
        run: npm test -- --maxWorkers=1 --reporter=default --reporter=github-actions --reporter=json --outputFile.json=ci-vitest-results.json

      - name: Build
        run: npm run build

      - name: Production closure proof (D2)
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types scripts/production-closure/prove.mts

      - name: Keep the closure receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-closure-receipt
          path: |
            ci-checkout.json
            output/next/closure/production-closure-receipt.json
            output/next/closure/build.log
            output/next/closure/server.log
          if-no-files-found: ignore

      # Preserve the existing execution for exact-checkout QA evidence reuse.
      # Uploading results is not a passing-test or release-approval claim.
      - name: Keep measured unit and guard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-checkout.json
            ci-vitest-results.json
            package-lock.json
            vitest.config.mts
            src/server/product/processing/ai-release-build-manifest.json
          if-no-files-found: ignore
