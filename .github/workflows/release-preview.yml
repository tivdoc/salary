name: Release Preview browser proof
on:
  push:
    branches: [codex/tivdoc-release-completion]
    paths:
      - .github/workflows/release-preview.yml
      - scripts/release-completion/preview-browser.mts
      - scripts/release-completion/preview-documents.mts
      - scripts/release-completion/preview-upload-retry.mts
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-preview-browser
  cancel-in-progress: false
jobs:
  browser:
    if: github.repository == 'tivdoc/salary' && github.ref == 'refs/heads/codex/tivdoc-release-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Read-only isolated hosted Preview journeys
        env:
          TIVDOC_PREVIEW_BROWSER_STATE: ${{ secrets.TIVDOC_PREVIEW_BROWSER_STATE }}
        run: node --experimental-strip-types scripts/release-completion/preview-browser.mts
      - name: Synthetic owner document journeys on isolated Preview
        env:
          TIVDOC_PREVIEW_BROWSER_STATE: ${{ secrets.TIVDOC_PREVIEW_BROWSER_STATE }}
          TIVDOC_PREVIEW_CASE_FIXTURES: ${{ secrets.TIVDOC_PREVIEW_CASE_FIXTURES }}
        run: node --experimental-strip-types scripts/release-completion/preview-upload-retry.mts
      - name: Keep public screenshots and scoped receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-preview-browser
          path: |
            output/release-completion/preview-browser/
            output/release-completion/preview-documents/
            output/release-completion/preview-upload-retry/
          retention-days: 14
          if-no-files-found: error
